{% extends "base.html" %}
{% block title %}{{ ent.label }}详情 · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1 class="page-title">{{ ent.label }}详情</h1>
    <div class="page-desc">记录 ID：{{ record.id }}</div>
  </div>
  <div class="actions">
    <a class="btn btn-ghost" href="/md/{{ ent.key }}">返回列表</a>
    <a class="btn btn-primary" href="/md/{{ ent.key }}/{{ record.id }}/edit">编辑</a>
  </div>
</div>
<div class="card card-pad">
  <div class="detail-grid">
    {% for label, value in items %}
    <div class="detail-item"><div class="k">{{ label }}</div><div class="v">{{ value }}</div></div>
    {% endfor %}
  </div>
</div>
{% endblock %}
